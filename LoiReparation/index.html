<style>
  :root{
    /* Mappé sur le thème Mayday (shared-theme.css) — Liquid Glass */
    --bg:#f5f5f7; --surface:var(--apple-card-bg, #ffffff); --surface-2:#fbfbfd; --text:#1d1d1f;
    --text-secondary:#86868b; --accent:#007AFF; --accent-hover:#0056CC;
    --ac-red:#FF3B30; --ac-green:#34C759; --ac-orange:#FF9500;
    --border:#d2d2d7; --border-soft:var(--glass-border-solid, #E5E5EA);
    --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
    color-scheme: light dark;
  }
  /* === DARK MODE (pillule lune — palette Mayday) === */
  html[data-theme="dark"]{
    --bg:#000000; --surface:rgba(44,44,46,0.75); --surface-2:#1c1c1e; --text:#f5f5f7;
    --text-secondary:#a1a1a6; --accent:#0A84FF; --accent-hover:#4facff;
    --border:#3a3a3c; --border-soft:#2c2c2e;
    --shadow: 0 8px 32px rgba(0,0,0,0.4);
    color-scheme: dark;
  }
  html[data-theme="dark"] .topbar{ background:rgba(28,28,30,0.65); border-color:rgba(255,255,255,0.1); }
  html[data-theme="dark"] .topbar-label{ color:#a1a1a6; }
  html[data-theme="dark"] .biblio-heading, html[data-theme="dark"] .bd-note, html[data-theme="dark"] .bd-kbase h4{ color:#a1a1a6; }
  html[data-theme="dark"] .bd-arrow{ color:#a1a1a6; }
  html[data-theme="dark"] .bd-kbase ul{ color:#f5f5f7; }

  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,"SF Pro Display","SF Pro Text",BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; min-height:100vh;
  }
  .topbar{
    position:sticky; top:0; z-index:50;
    backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px);
    background:color-mix(in srgb, var(--bg) 72%, transparent);
    border-bottom:1px solid var(--border-soft);
  }
  .topbar-inner{ max-width:720px; margin:0 auto; padding:14px 22px; display:flex; align-items:center; gap:10px; }
  .apple-logo{ width:15px; height:18px; flex-shrink:0; opacity:.92; }
  .topbar-label{ font-size:13px; font-weight:600; color:var(--text-secondary); letter-spacing:-0.01em; }
  .wrap{ max-width:720px; margin:0 auto; padding:120px 24px 64px; }
  h1{ font-size:56px; line-height:1.1; letter-spacing:-1.8px; font-weight:700; margin:0 0 8px; text-align:center;
    background: linear-gradient(135deg, var(--apple-text) 0%, var(--apple-text-secondary) 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  @media (max-width: 640px){ h1{ font-size:36px; letter-spacing:-1.2px; } }
  .subtitle{ text-align:center; font-size:14px; color:var(--text-secondary); margin:0 0 36px; max-width:480px; margin-left:auto; margin-right:auto; line-height:1.45; }

  /* Select boxes */
  .select-group{ display:flex; flex-direction:column; gap:14px; max-width:480px; margin:0 auto; }
  .select-box{
    position:relative; border:1.5px solid var(--border); border-radius:12px;
    padding:9px 42px 9px 16px; background:var(--surface);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .select-box:hover{ border-color:var(--accent); }
  .select-box:focus-within{ border-color:var(--accent); box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 16%, transparent); }
  .select-box label{ display:block; font-size:12.5px; color:var(--text-secondary); margin-bottom:1px; }
  .select-box select{
    position:absolute; inset:0; width:100%; height:100%;
    opacity:0; cursor:pointer; z-index:2;
    appearance:none; -webkit-appearance:none; border:none; margin:0; font-family:inherit; font-size:16px;
  }
  .select-box select:focus{ outline:none; }
  .select-box .value{ font-size:19px; font-weight:600; letter-spacing:-0.01em; color:var(--text); padding-top:2px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .select-box .chevron{ position:absolute; right:16px; top:50%; transform:translateY(-50%); width:13px; height:13px; color:var(--text-secondary); pointer-events:none; }

  /* Result */
  .result-panel{ max-width:640px; margin:40px auto 0; }
  .result-placeholder{ text-align:center; color:var(--text-secondary); font-size:14px; padding:40px 0; }

  .verdict-box{ border-radius:16px; padding:18px 22px; margin-bottom:14px; display:flex; align-items:flex-start; gap:14px; }
  .verdict-box.eligible{ background:color-mix(in srgb, var(--ac-green) 10%, var(--surface)); border:1px solid color-mix(in srgb, var(--ac-green) 25%, transparent); }
  .verdict-box.partial{ background:color-mix(in srgb, var(--ac-orange) 10%, var(--surface)); border:1px solid color-mix(in srgb, var(--ac-orange) 25%, transparent); }
  .verdict-box.not-eligible{ background:color-mix(in srgb, var(--ac-red) 8%, var(--surface)); border:1px solid color-mix(in srgb, var(--ac-red) 20%, transparent); }
  .verdict-icon{ font-size:28px; line-height:1; flex-shrink:0; }
  .verdict-box h2{ margin:0 0 4px; font-size:17px; }
  .verdict-box p{ margin:0; font-size:13px; color:var(--text-secondary); line-height:1.4; }

  .quick-card{ background:var(--surface); border:1px solid var(--border-soft); border-radius:14px; padding:16px 20px; margin-bottom:12px; box-shadow:var(--shadow); }
  .quick-card h3{ font-size:15px; font-weight:600; margin:0 0 8px; }
  .quick-card p{ font-size:13.5px; line-height:1.5; margin:0 0 8px; color:var(--text); }
  .quick-card p:last-child{ margin-bottom:0; }
  .quick-card ul{ font-size:13.5px; line-height:1.55; margin:6px 0 8px; padding-left:18px; }
  .quick-card li{ margin-bottom:3px; }
  .quick-card a{ color:var(--accent); text-decoration:none; font-weight:500; }
  .quick-card a:hover{ text-decoration:underline; }

  .tag{ display:inline-block; font-size:10.5px; font-weight:600; padding:2px 9px; border-radius:980px; margin-right:5px; background:color-mix(in srgb, var(--accent) 10%, transparent); color:var(--accent); }
  .tag.red{ background:color-mix(in srgb, var(--ac-red) 10%, transparent); color:var(--ac-red); }
  .tag.green{ background:color-mix(in srgb, var(--ac-green) 12%, transparent); color:var(--ac-green); }
  .tag.orange{ background:color-mix(in srgb, var(--ac-orange) 12%, transparent); color:var(--ac-orange); }

  /* Expandable "En savoir plus" */
  .expand-link{
    display:inline-block; font-size:13px; font-weight:500; color:var(--accent);
    cursor:pointer; margin-top:6px; user-select:none;
  }
  .expand-link:hover{ color:var(--accent-hover); text-decoration:underline; }
  .expand-link::after{ content:" ›"; font-size:14px; transition:transform .2s ease; display:inline-block; }
  .expand-link.open::after{ transform:rotate(90deg); }
  .expand-content{ display:none; margin-top:10px; padding-top:10px; border-top:1px solid var(--border-soft); }
  .expand-content.open{ display:block; }
  .expand-content p{ font-size:13px; line-height:1.5; margin:0 0 8px; color:var(--text-secondary); }
  .expand-content p:last-child{ margin-bottom:0; }
  .expand-content ul{ font-size:13px; line-height:1.55; margin:6px 0; padding-left:18px; color:var(--text-secondary); }
  .expand-content li{ margin-bottom:3px; }
  .expand-content a{ color:var(--accent); text-decoration:none; font-weight:500; }
  .expand-content a:hover{ text-decoration:underline; }

  .callout{
    background:color-mix(in srgb, var(--accent) 6%, var(--surface-2));
    border-left:3px solid var(--accent); border-radius:0 10px 10px 0;
    padding:12px 16px; margin:10px 0; font-size:13px; line-height:1.5;
  }
  .callout.warn{ background:color-mix(in srgb, var(--ac-red) 6%, var(--surface-2)); border-left-color:var(--ac-red); }
  .callout.warn strong{ color:var(--ac-red); }
  .callout.success{ background:color-mix(in srgb, var(--ac-green) 8%, var(--surface-2)); border-left-color:var(--ac-green); }
  .callout.success strong{ color:var(--ac-green); }

  .price-table{ width:100%; border-collapse:collapse; margin:10px 0; font-size:13px; }
  .price-table th{ text-align:left; font-size:11.5px; color:var(--text-secondary); font-weight:500; padding:6px 10px; border-bottom:1px solid var(--border-soft); }
  .price-table td{ padding:8px 10px; border-bottom:1px solid var(--border-soft); }
  .price-table tr:last-child td{ border-bottom:none; }

  
  /* Scenarios */
  .scenarios{ max-width:480px; margin:0 auto 28px; display:flex; flex-direction:column; gap:8px; }
  .scenarios-label{ font-size:12.5px; font-weight:600; color:var(--text-secondary); text-transform:uppercase; letter-spacing:0.02em; margin:0 0 4px; }
  .scenario-btn{
    display:block; width:100%; text-align:left; background:var(--surface);
    border:1.5px solid var(--border); border-radius:12px; padding:12px 16px;
    font-family:inherit; font-size:13.5px; color:var(--text); cursor:pointer;
    transition:border-color .15s ease, background .15s ease; line-height:1.4;
  }
  .scenario-btn:hover{ border-color:var(--accent); background:var(--surface-2); }
  .scenario-btn.active{ border-color:var(--accent); background:color-mix(in srgb, var(--accent) 6%, var(--surface)); }
  .scenario-btn .sc-title{ font-weight:600; font-size:14px; display:block; margin-bottom:2px; }
  .scenario-btn .sc-desc{ font-size:12px; color:var(--text-secondary); }
  .scenario-btn .sc-icon{ display:inline-block; margin-right:6px; }
    .footer a{ color:var(--text-secondary); text-decoration:none; }
  .footer a:hover{ color:var(--accent); text-decoration:underline; }
  ::selection{ background:color-mix(in srgb, var(--accent) 30%, transparent); }

  @media(max-width:480px){
    
    .wrap{ padding:88px 16px 40px; }
    h1{ font-size:24px; }
    .subtitle{ font-size:12.5px; margin-bottom:24px; }
    .select-group{ gap:10px; }
    .select-box{ padding:8px 38px 8px 14px; }
    .select-box label{ font-size:12px; }
    .select-box .value{ font-size:17px; }
    .select-box .chevron{ right:14px; }
    .quick-card{ padding:14px 16px; }
    .verdict-box{ padding:14px 16px; }
    .verdict-icon{ font-size:24px; }
  }

  /* === Fiches Biblio (accordéons) === */
  .biblio-section{ margin: 28px 0 8px; }
  .biblio-heading{ font-size: 15px; font-weight: 700; color: #6e6e73; text-transform: uppercase; letter-spacing: .06em; margin: 0 0 10px; }
  .biblio-dropdown{ background: var(--card-bg, #fff); border: 1px solid var(--border-color, rgba(0,0,0,.08)); border-radius: 14px; margin-bottom: 10px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
  .biblio-dropdown summary{ display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px; cursor: pointer; font-weight: 600; font-size: 15px; color: var(--text-main, #1d1d1f); list-style: none; user-select: none; }
  .biblio-dropdown summary::-webkit-details-marker{ display: none; }
  .biblio-dropdown .bd-arrow{ transition: transform .25s ease; color: #86868b; flex: none; }
  .biblio-dropdown[open] .bd-arrow{ transform: rotate(180deg); }
  .bd-body{ padding: 4px 16px 16px; border-top: 1px solid var(--border-color, rgba(0,0,0,.08)); }
  .bd-grid{ display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-top: 12px; }
  .bd-card{ border-radius: 12px; padding: 12px 14px; color: #fff; }
  .bd-card h3{ margin: 0 0 8px; font-size: 14px; text-decoration: underline; }
  .bd-card ul{ margin: 0; padding-left: 16px; font-size: 13px; line-height: 1.55; }
  .bd-blue{ background: #0a84ff; } .bd-teal{ background: #0aa; } .bd-green{ background: #34c759; }
  .bd-brown{ background: #8a5a2b; } .bd-red{ background: #a0293e; } .bd-purple{ background: #af52de; }
  .bd-note{ font-size: 13px; color: #6e6e73; margin: 10px 0; }
  .bd-table-wrap{ overflow-x: auto; margin: 8px 0 14px; }
  .bd-table{ width: 100%; border-collapse: collapse; font-size: 12.5px; min-width: 560px; }
  .bd-table th{ background: #0071e3; color: #fff; padding: 8px 10px; text-align: left; font-size: 12px; }
  .bd-table td{ padding: 7px 10px; border: 1px solid var(--border-color, rgba(0,0,0,.08)); vertical-align: top; }
  .sol-repair{ color: #1d7a2f; font-weight: 700; }
  .sol-swap{ color: #c23a3a; font-weight: 700; }
  .bd-kbase h4{ margin: 0 0 6px; font-size: 13px; color: #6e6e73; text-transform: uppercase; letter-spacing: .05em; }
  .bd-kbase ul{ margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.7; color: var(--text-main, #1d1d1f); }

</style>

// ========== RESULT ENGINE =========
function getResultReparables(s) {
  // Symptôme → sous-ensemble (le verdict inverse la logique: on part du
  // symptôme constaté, l'app affiche le sous-ensemble à remplacer):
  const cat = s["reparables-cat"];
  const q = QUESTIONS.find(qq => qq.id === "reparables-symptom");
  const opts = (q.optionsByCat && q.optionsByCat[cat]) || [];
  const opt = opts.find(o => o.value === s["reparables-symptom"]);
  if (!opt) return { verdict: "not-eligible", title: "?", summary: "?", cards: [] };
  const data = {
    logic: {
      title: "Carte logique",
      summary: "Ce symptôme pointe vers la carte logique — remplacement de la carte logique."
    },
    enclosure: {
      title: "Enclosure (châssis)",
      summary: "Ce symptôme pointe vers l'enclosure — remplacement du châssis."
    },
    screen: {
      title: "Écran",
      summary: "Ce symptôme pointe vers l'écran — remplacement de l'écran."
    },
    backglass: {
      title: "Back Glass (vitre arrière)",
      summary: "Ce symptôme pointe vers la vitre arrière — remplacement du back glass."
    },
    microspk: {
      title: "Micro / Haut-parleur",
      summary: "Ce symptôme pointe vers l'ensemble micro / haut-parleur."
    },
    camera: {
      title: "Caméra",
      summary: "Ce symptôme pointe vers la caméra — si le défaut persiste après remplacement, carte logique."
    }
  };
  const d = data[opt.sub];
  // Les AUTRES symptômes du même sous-ensemble PHYSIQUE (toutes
  // catégories confondues — contexte de diagnostic):
  const allOpts = Object.values(q.optionsByCat).flat();
  const others = allOpts.filter(o => o.sub === opt.sub && o.value !== opt.value).map(o => o.label);
  return {
    verdict: "eligible",
    title: d.title,
    summary: d.summary,
    cards: [
      { title: "Autres symptômes du même sous-ensemble", body: `<ul>${others.map(i => `<li>${i}</li>`).join('')}</ul>` },
      { title: "Notes & Kbase associées", body: `<p><strong>*Couvert</strong> = Sous garantie / AC+ / AC Services / Loi euro / Programme qualité.</p><p>Kbase : <strong>111090</strong> — Procédure panne mixte · <strong>106063</strong> — Traitement répa mixte · <strong>108632</strong> — Rear system · <strong>108633</strong> — Mid system.</p>` }
    ]
  };
}

function getResultSwap(s) {
  const gen = s["swap-generation"], model = s["swap-model"], part = s["swap-part"], st = s["swap-status"];
  if (!gen || !model || !part || !st) return { verdict: "not-eligible", title: "?", summary: "?", cards: [] };
  // Prix swap depuis le label du modèle choisi:
  const qm = QUESTIONS.find(qq => qq.id === "swap-model");
  const modelOpt = (qm.optionsByModel[gen] || []).find(o => o.value === model);
  const px = (modelOpt && modelOpt.swapPrice) ? modelOpt.swapPrice + " €" : null;
  const priceTxt = px ? ` Coût swap : <strong>${px}</strong>.` : "";
  let solution, reason;
  if (part === "modules-4") {
    solution = "Swap";
    reason = "4 modules ou plus → toujours Swap (hors garantie comme couvert*)." + priceTxt;
  } else if (part === "modules-123") {
    if (st === "covered") { solution = "Repair"; reason = "1 à 3 modules, couvert* → Repair."; }
    else if (st === "og-cheaper") { solution = "Repair"; reason = "Hors garantie — si € répa < " + (px ? px : "€ swap") + " → Repair." + (px ? " Au-delà, passer en Swap." : ""); }
    else { solution = "Swap"; reason = "Hors garantie, coût réparation > coût swap → Swap." + priceTxt; }
  } else if (part === "mid-display" || part === "rear-display") {
    solution = "Swap";
    reason = "Mid/Rear + Display → toujours Swap (couvert* ou non)." + priceTxt;
  } else if (st === "covered") {
    solution = "Repair";
    reason = "Couvert* → Repair.";
  } else if (st === "partial") {
    solution = "Repair";
    reason = part === "rear-camera" ? "Au moins 1 pièce sous garantie → Repair." : "Au moins 1 module couvert → Repair.";
  } else {
    solution = "Swap";
    reason = "Hors garantie → Swap." + priceTxt;
  }
  const cls = solution === "Swap" ? "not-eligible" : "eligible";
  return {
    verdict: cls,
    title: solution,
    summary: reason,
    cards: [{ title: "Notes & Kbase associées", body: "<p><strong>*Couvert</strong> = Sous garantie / AC+ / AC Services / Loi euro / Programme qualité.</p><p>Kbase : <strong>111090</strong> — Procédure panne mixte · <strong>106063</strong> — Traitement répa mixte · <strong>108632</strong> — Rear system · <strong>108633</strong> — Mid system.</p>" }]
  };
}

function getResult(s) {
  const p = PRODUCTS[s.product];
  let cards = [];

  // --- ÉLIGIBILITÉ EN APPLE STORE ( Genius Bar perspective ) ---
  // Apple Store peut réparer sous loi EU si:
  // 1. Apple Store est le VENDEUR (achat sur place ou revendeur agréé) + < 2 ans + défaut → GRATUIT
  // 2. Apple est le FABRICANT + produit Annexe II + 2-10 ans + défaut → PAYANT (droit à la réparation)
  // 3. Remplacement antérieur sous garantie → garantie renouvelée 2 ans → GRATUIT

  const isAppleVendor = (s.purchase === "apple-store");
  const country = s.country || "france";
  const isFRUE = (country === "france" || country === "ue");
  const isAnnexII = p.annexII;
  // Hors UE : pas de garantie légale de conformité FR/UE ni de droit à
  // la réparation UE — uniquement la garantie commerciale Apple et la
  // garantie constructeur (1 an, monde entier).
  const isDefect = (s.condition === "defect" || s.condition === "battery");
  const isAccidental = (s.condition === "accidental" || s.condition === "liquid");
  const isUnderWarranty = (s.age === "under-1" || s.age === "1-2");
  const isYear1 = s.age === "under-1";
  const isYear2 = s.age === "1-2";

  // Can Apple Store process this under EU law or manufacturer warranty?
  let canStore = false;
  let storeReason = "";
  let storeCost = "";

  if (!isFRUE) {
    // Hors UE : ni garantie légale de conformité FR/UE, ni droit à la
    // réparation UE. Apple reste tenu par la garantie constructeur
    // (1 an, monde entier) et sa garantie commerciale éventuelle.
    if (isYear1 && isDefect) {
      canStore = true;
      storeReason = "Achat hors UE : <strong>garantie constructeur Apple (1 an)</strong> — valable dans le monde entier. Réparation gratuite (défaut de fabrication).";
      storeCost = "Gratuit (garantie constructeur)";
    } else {
      canStore = true;
      storeReason = "Achat hors UE : la garantie légale de conformité FR/UE et le droit à la réparation UE <strong>ne s'appliquent pas</strong>. Au-delà de la garantie constructeur (1 an), seules la <strong>garantie commerciale Apple</strong> du client (AC+, AppleCare) ou une <strong>réparation payante</strong> au tarif hors garantie sont possibles (+ 90 jours de garantie sur la réparation).";
      storeCost = "Selon AC+/AppleCare, sinon payant";
    }
    const verdictHorsUE = (isYear1 && isDefect) ? "eligible" : "partial";
    return {
      verdict: verdictHorsUE,
      title: (isYear1 && isDefect) ? "Éligible garantie constructeur (achat hors UE)" : "Hors UE — pas de garantie légale FR/UE",
      summary: `${storeReason} Coût : <strong>${storeCost}</strong>.`,
      cards: [
        { title: "Action sur place", tag: verdictHorsUE === "eligible" ? "green" : "orange", tagLabel: storeCost, body: `
          <p><strong>${(isYear1 && isDefect) ? "Procéder à la réparation." : "Vérifier la couverture AC+/AppleCare du client, sinon proposer un devis payant."}</strong></p>
          <p>Prendre rendez-vous : <a href="https://www.apple.com/fr/shop/repair" target="_blank" rel="noopener">apple.com/fr/shop/repair</a></p>` }
      ]
    };
  }

  if (isYear1 && isDefect) {
    // 1ère année : garantie constructeur Apple (1 an) + garantie légale si Apple est vendeur
    canStore = true;
    if (isAppleVendor) {
      storeReason = "<strong>Garantie légale de conformité</strong> (2 ans, vendeur) + <strong>garantie constructeur Apple</strong> (1 an). Apple Store est le vendeur et le fabricant — réparation gratuite.";
    } else {
      storeReason = "<strong>Garantie constructeur Apple</strong> (1 an) — Apple répare gratuitement quel que soit le lieu d'achat. La garantie légale reste à la charge du vendeur d'origine, mais le client peut choisir l'Apple Store.";
    }
    storeCost = "Gratuit";
  } else if (isYear2 && isDefect && isAppleVendor) {
    // 2ème année : seule la garantie légale s'applique (vendeur).
    // Sans vendeur Apple → ne PAS consommer la chaîne: les branches
    // apple-replace/apple-repair doivent pouvoir s'évaluer.
    canStore = true;
    storeReason = "<strong>Garantie légale de conformité</strong> (2 ans) — Apple Store est le <strong>vendeur</strong>. Présomption d'antériorité du défaut pendant <strong>24 mois</strong> pour un bien neuf (art. L217-7). Garantie constructeur expirée (1 an).";
    storeCost = "Gratuit";
  } else if (isAnnexII && (s.age === "2-5" || s.age === "5-10") && isDefect && !["apple-replace", "apple-repair"].includes(s["prior-repair"])) {
    // Garantie légale EXPIRÉE (> 2 ans sans réparation antérieure). Le
    // droit à la réparation (directive 2024/1799, Annexe II) oblige le
    // fabricant à proposer la réparation à prix raisonnable — ce n'est
    // PAS une prise en charge gratuite. Réparation hors garantie →
    // 90 jours de garantie Apple sur la réparation.
    canStore = true;
    storeReason = `<strong>Garantie légale expirée</strong> (2 ans — aucune réparation ni remplacement antérieur). Apple reste le <strong>fabricant</strong> d'un produit Annexe II (directive 2024/1799) : elle doit proposer la <strong>réparation payante</strong> à un prix raisonnable.`;
    storeCost = "Payant — tarif hors garantie, + 90 j de garantie";
  } else if (s["prior-repair"] === "apple-replace" && isDefect) {
    // Le remplacement sous garantie légale renouvelle 2 ans À COMPTER
    // du remplacement - MAIS c'est le VENDEUR d'origine qui est tenu
    // (garantie légale = obligation du vendeur). Si l'achat d'origine
    // est chez un tiers, le renouvellement profite chez le vendeur,
    // pas en Apple Store (sauf si Apple a vendu le produit de
    // remplacement - alors garantie commerciale Apple).
    const isAppleOrigin = (s.purchase === "apple-store");
    if (isAppleOrigin && isUnderWarranty) {
      canStore = true;
      storeReason = "Appareil acheté chez Apple et remplacé sous garantie — garantie légale <strong>renouvelée 2 ans</strong> à compter du remplacement. Réparation gratuite.";
      storeCost = "Gratuit";
    } else if (isAppleOrigin) {
      canStore = true;
      storeReason = "Appareil acheté chez Apple et remplacé sous garantie — la garantie légale est <strong>renouvelée 2 ans à compter du remplacement</strong>. Vérifier la date du remplacement : si elle date de moins de 2 ans, réparation gratuite ; au-delà, hors garantie (réparation payante + 90 j de garantie).";
      storeCost = "Gratuit si remplacement < 2 ans, sinon payant";
    } else {
      // Achat d'origine chez un tiers + appareil remplacé par Apple.
      // Le remplacement au Genius Bar est un SERVICE (pas une vente):
      // Apple ne devient PAS vendeur du bien de remplacement.
      // Garantie de service Apple = 90 jours sur le remplacement
      // (Conditions générales de réparation Apple). La garantie
      // légale renouvelée (2 ans sur le bien de remplacement,
      // L217-13 al. 2) incombe au VENDEUR D'ORIGINE.
      canStore = true;
      storeReason = "<strong>Vérifier les 90 jours :</strong> le remplacement effectué par Apple est couvert par la <strong>garantie de service Apple de 90 jours</strong> (ou la durée restante de la garantie Apple, la plus longue). Si le remplacement date de <strong>moins de 90 jours</strong>, la réparation est gratuite ici ; sinon, réparation payante (+ 90 j de garantie). La garantie légale renouvelée (2 ans sur le bien de remplacement) incombe au <strong>vendeur d'origine</strong> — carte suivante.";
      storeCost = "Gratuit si remplacement < 90 j — sinon payant + 90 j";
    }
  } else if (s["prior-repair"] === "apple-repair" && isUnderWarranty && isDefect) {
    canStore = true;
    storeReason = "Appareil réparé sous garantie — garantie légale <strong>prolongée de 12 mois</strong> (Service Public F11094 ; art. 16 directive 2024/1799 — pour les ventes à partir du 31/07/2026). Réparation gratuite.";
    storeCost = "Gratuit";
  } else if (s["prior-repair"] === "apple-repair" && isDefect && (s.age === "2-5")) {
    // Réparation antérieure sous garantie: prolongation 1 an possible
    // selon la date de la réparation (art. 10(2) dir. 2019/771):
    canStore = true;
    storeReason = "Trois cas : <strong>rechute du même défaut</strong> → gratuit ici (garantie Apple 90 j sur la réparation). <strong>Nouveau défaut + réparation < 12 mois</strong> → garantie légale prolongée chez le <strong>vendeur d'origine</strong> (facture). <strong>Sinon</strong> → payant.";
    storeCost = "Gratuit si rechute · vendeur si < 12 mois · sinon payant";
  }

  // --- VERDICT PRINCIPAL ---
  let verdict, title, summary;
  const isPayantUE = isAnnexII && (s.age === "2-5" || s.age === "5-10") && isDefect && !["apple-replace", "apple-repair"].includes(s["prior-repair"]);
  const isDateCheck = isDefect && ((s["prior-repair"] === "apple-replace" && (!isUnderWarranty || !isAppleVendor)) || (s["prior-repair"] === "apple-repair" && s.age === "2-5"));
  if (canStore) {
    verdict = (isPayantUE || isDateCheck) ? "partial" : "eligible";
    if (isYear1 && isDefect && isAppleVendor) {
      title = "Éligible garantie constructeur + garantie légale";
      summary = `<strong>Garantie constructeur Apple</strong> (1 an) + <strong>garantie légale de conformité</strong> (2 ans, vendeur). Apple Store est vendeur et fabricant — réparation gratuite. Coût : <strong>${storeCost}</strong>.`;
    } else if (isYear1 && isDefect && !isAppleVendor) {
      title = "Éligible garantie constructeur Apple";
      summary = `<strong>Garantie constructeur Apple</strong> (1 an) — Apple répare gratuitement quel que soit le lieu d'achat. La garantie légale reste à la charge du vendeur d'origine. Coût : <strong>${storeCost}</strong>.`;
    } else if (isYear2 && isDefect && isAppleVendor) {
      title = "Éligible garantie légale de conformité";
      summary = `<strong>Garantie légale de conformité</strong> (2 ans) — Apple Store est le vendeur. Garantie constructeur expirée (1 an). Présomption d'antériorité pendant 24 mois pour un bien neuf (art. L217-7). Coût : <strong>${storeCost}</strong>.`;
    } else if (s["prior-repair"] === "apple-replace" && isDefect) {
      title = isAppleVendor ? (isUnderWarranty ? "Éligible garantie légale renouvelée" : "Garantie renouvelée ? — vérifier la date du remplacement") : "Vérifier : remplacement couvert par les 90 jours de garantie de service ?";
      summary = `${storeReason} Coût : <strong>${storeCost}</strong>.`;
    } else if (s["prior-repair"] === "apple-repair" && isUnderWarranty && isDefect) {
      title = "Éligible garantie légale prolongée";
      summary = `${storeReason} Coût : <strong>${storeCost}</strong>.`;
    } else if (s["prior-repair"] === "apple-repair" && isDefect) {
      title = "Pas couvert ici — garantie légale possible chez le vendeur";
      summary = `${storeReason} Coût : <strong>${storeCost}</strong>.`;
    } else if (isAnnexII && (s.age === "2-5" || s.age === "5-10") && isDefect) {
      title = "Hors garantie légale — réparation payante possible (droit à la réparation UE)";
      summary = `Garantie légale <strong>expirée</strong> (2 ans, ${s["prior-repair"] === "third-party" ? 'réparation antérieure par un tiers — la garantie légale n\'a pas été prolongée par Apple' : s["prior-repair"] === "self" ? 'auto-réparation antérieure (Self Service Repair)' : 'aucune réparation ni remplacement antérieur'}). Le droit à la réparation (directive 2024/1799, art. 5) demande au fabricant d'un produit Annexe II de proposer la réparation à <strong>prix raisonnable</strong> (gratuite ou payante — ici hors garantie, au tarif Apple). Nuances : applicable aux contrats conclus à compter du 31/07/2026 (Service Public) ; transposition française en cours au 19/09/2026 — pas encore opposable en droit français, Apple peut l'appliquer à titre commercial. Une réparation effectuée bénéficie de <strong>90 jours de garantie</strong> sur celle-ci. Coût : <strong>${storeCost}</strong>.`;
    } else {
      title = "Réparation possible en Apple Store";
      summary = `${storeReason} Coût : <strong>${storeCost}</strong>.`;

          <tr><td>iPhone</td><td>29 €</td><td>99 €</td></tr>
          <tr><td>iPad</td><td>29 €</td><td>49–99 €</td></tr>

          <tr><td>MacBook Neo</td><td>59 €</td><td>179 €</td></tr>
          <tr><td>Apple Watch</td><td>—</td><td>65–75 €</td></tr>
          <tr><td>AirPods</td><td>—</td><td>29 €</td></tr>

        <p>AppleCare One (20,99€/mois, 3 produits) inclut aussi la garantie perte ou vol : franchise 129€ (iPhone/iPad), 119€ (Apple Watch).</p>
        <p><a href="https://www.apple.com/legal/sales-support/terms/repair/generalservice/servicetermsfr" target="_blank" rel="noopener">Conditions générales Apple</a> · <a href="https://repairprice.popalazerk.com" target="_blank" rel="noopener">Tarifs complets</a></p>
      </div>
    `});
  }

  // 4. RÉPARATION OU REMPLACEMENT ANTÉRIEUR
  const pr = s["prior-repair"];

  // éviter la 4e/5e répétition de la règle rechute / 12 mois / payant.
  const priorAppleCardsSuppressed = (pr === "apple-repair");
  // "Remplacement antérieur par Apple" : redondant dès qu'une autre carte
  // porte déjà la règle du renouvellement 2 ans (carte Vendeur, carte
  // Action "vérifier la date", ou verdict sous garantie).
  const priorReplaceSuppressed = (pr === "apple-replace" && (isDefect || s.purchase !== "apple-store"));
  if (pr === "apple-repair" && !priorAppleCardsSuppressed) {
    cards.push({ title:"Réparation antérieure par Apple", tag:"green", tagLabel:"Voir détail", body:`
      <p><strong>Si la réparation était sous garantie légale (défaut de conformité, 2 ans) :</strong> garantie prolongée d'<strong>un an</strong> (directive 2024/1799, art. 16). <strong>Le vendeur</strong> reste responsable de cette extension, pas Apple en tant que fabricant.</p>
      <p><strong>Si la réparation était hors garantie (payante) :</strong> pas de prolongation de garantie légale. Garantie commerciale Apple de 90 jours sur la réparation uniquement.</p>
      <p><strong>Garantie service Apple (90 jours)</strong> : s'ajoute dans les deux cas — Apple garantit la réparation effectuée pendant 90 jours.</p>
      <span class="expand-link" onclick="toggleExpand(this)">En savoir plus</span>
      <div class="expand-content">
        <h4 style="font-size:13px;font-weight:600;margin:0 0 6px;">Réparation sous garantie légale (art. 16, directive 2024/1799)</h4>
        <p>Si le client a choisi la réparation plutôt que le remplacement pendant la garantie légale de conformité (2 ans), la garantie est <strong>prolongée de 6 mois</strong> à compter de la restitution (L217-13; 12 mois UE pour les ventes à partir du 31/07/2026).</p>
        <p><strong>Qui est responsable de l'extension ?</strong> Le <strong>vendeur</strong> (Apple Store si achat sur place, Fnac/Darty si achat ailleurs). L'article 16 modifie la directive 2019/771 sur la vente de biens — c'est la relation vendeur-acheteur qui est concernée, pas le fabricant.</p>
        <p>Exemple : achat en janvier 2026 chez Fnac, défaut en juin 2027 (sous garantie), Fnac envoie chez Apple pour réparation → garantie prolongée de 6 mois, jusqu'en décembre 2027 (L217-13). <strong>Fnac reste responsable</strong> de cette extension. Le client s'adresse à Fnac en cas de nouveau défaut.</p>
        <p>Exemple : achat en janvier 2026 en Apple Store, défaut en juin 2027 → garantie prolongée de 6 mois, jusqu'en décembre 2027 (L217-13). <strong>Apple Store est responsable</strong> (vendeur et fabricant).</p>
        <h4 style="font-size:13px;font-weight:600;margin:12px 0 6px;">Réparation hors garantie (art. 5)</h4>
        <p>Une réparation payante effectuée après la période de garantie (droit à la réparation) ne prolonge <strong>pas</strong> la garantie légale. L'article 16 (directive 2024/1799) ne s'applique pas.</p>
        <p>Exemple : achat en janvier 2024, écran cassé en juin 2026 (hors garantie), réparation payante → pas de prolongation. Garantie Apple de 90 jours sur la réparation uniquement.</p>
        <h4 style="font-size:13px;font-weight:600;margin:12px 0 6px;">Garantie service Apple (90 jours)</h4>
        <p>Dans tous les cas, Apple garantit la réparation effectuée pendant 90 jours (ou jusqu'à la fin de la garantie légale si plus longue). Cette garantie est <strong>contractuelle</strong> (Apple en tant que réparateur), indépendante de la garantie légale.</p>
        <p><a href="http://data.europa.eu/eli/dir/2024/1799/oj" target="_blank" rel="noopener">Directive 2024/1799, art. 5 et 16</a> · <a href="https://www.service-public.gouv.fr/particuliers/actualites/A19033" target="_blank" rel="noopener">Service Public</a> · <a href="https://www.apple.com/legal/sales-support/terms/repair/generalservice/servicetermsfr" target="_blank" rel="noopener">Conditions Apple</a></p>
      </div>
    `});
  } else if (pr === "apple-replace" && !priorReplaceSuppressed) {
    cards.push({ title:"Remplacement antérieur par Apple", tag:"green", tagLabel:"Garantie renouvelée", body:`
      <p><strong>Effet sur la garantie :</strong> si le vendeur a <strong>imposé</strong> le remplacement pendant la garantie légale, celle-ci est <strong>renouvelée pour 2 ans</strong> sur l'appareil de remplacement.</p>
      <span class="expand-link" onclick="toggleExpand(this)">En savoir plus</span>
      <div class="expand-content">
        <p>Le remplacement imposé par le vendeur (et non choisi par le client) renouvelle la garantie légale de conformité pour <strong>2 ans</strong> à compter de la date de remplacement (art. L217-11 du Code de la consommation).</p>
        <p>Exemple : achat en janvier 2026, remplacement imposé en juin 2026 → garantie sur le nouvel appareil jusqu'en juin 2028.</p>
        <p><strong>Neuf ou reconditionné ?</strong> Apple fournit un appareil « constitué de pièces d'origine Apple neuves et/ou précédemment utilisées, testées et répondant aux exigences fonctionnelles d'Apple ». En pratique, la majorité des remplacements sont des appareils reconditionnés équivalents au modèle du client.</p>
        <p><a href="https://www.legifrance.gouv.fr/codes/id/LEGIARTI000032225325/" target="_blank" rel="noopener">Art. L217-11 Code de la consommation</a> · <a href="https://www.apple.com/legal/sales-support/terms/repair/generalservice/servicetermsfr" target="_blank" rel="noopener">Conditions Apple</a></p>
      </div>
    `});
  } else if (pr === "third-party" || pr === "self") {
    const isSelf = pr === "self";
    cards.push({ title:`Réparation antérieure ${isSelf ? "(self-service)" : "(tiers)"}`, tag:"orange", tagLabel:"Attention", body:`
      <p><strong>Directive 2024/1799 :</strong> Apple ne peut pas refuser une réparation au seul motif qu'un tiers a déjà réparé. Informer Apple de toute modification.</p>
      <span class="expand-link" onclick="toggleExpand(this)">En savoir plus</span>
      <div class="expand-content">
        <p>La directive interdit aux fabricants de refuser une réparation parce qu'un tiers (ou le consommateur lui-même) a déjà réparé le produit.</p>
        <p>Apple peut toutefois facturer le coût du diagnostic (art. 4(3) : coûts réels du service, annoncé à l'avance) si : le produit ne requiert pas de réparation, la panne résulte de logiciels ou de pièces non-Apple, ou des dommages accidentels. La garantie n'est pas affectée par une réparation Self Service Repair (si les instructions Apple sont suivies), mais tout dommage causé pendant l'opération ne sera pas couvert. Une réparation par un tiers non agréé peut affecter la garantie pour les dommages causés par cette réparation.</p>
        <p>Apple doit être informée de toute modification non autorisée ou réparation par un tiers lors de la commande de service.</p>
        <p><a href="http://data.europa.eu/eli/dir/2024/1799/oj" target="_blank" rel="noopener">Directive, considérant 24</a> · <a href="https://www.apple.com/legal/sales-support/terms/repair/generalservice/servicetermsfr" target="_blank" rel="noopener">Conditions Apple</a></p>
      </div>
    `});
  }

  // 5. DURÉE DE GARANTIE APRÈS RÉPARATION (contextuel selon le scénario)
  let garantApresBody = "";
  // Scénario "réparé par Apple + 2-5 ans" : la carte Action + la carte
  // Vendeur couvrent déjà le sort de la garantie (rechute 90 j /
  // prolongation 12 mois / payant sans prolongation) — pas de carte
  // générique supplémentaire.
  const skipGarantApres = (s["prior-repair"] === "apple-repair" && s.age === "2-5") ||
    (s["prior-repair"] === "apple-replace" && isDefect);
  if (isYear1 && isDefect && isAppleVendor && !skipGarantApres) {
    // Achat Apple Store + réparation 1ère année = sous garantie légale
    garantApresBody = `
      <table class="price-table">
        <tr><th></th><th>Garantie légale</th><th>Garantie Apple</th></tr>
        <tr><td><strong>Réparation choisie</strong></td><td><strong>+6 mois</strong> (L217-13, ventes avant le 31/07/2026)<br><strong>+12 mois</strong> (art. 16 dir. 2024/1799, ventes à partir du 31/07/2026)<br>à compter de la réparation<br>Responsable : Apple Store (vendeur)</td><td>90 jours sur la réparation</td></tr>
        <tr><td><strong>Remplacement imposé</strong></td><td><strong>Renouvelée 2 ans</strong> (art. L217-11)<br>à compter du remplacement<br>Responsable : Apple Store (vendeur)</td><td>90 jours sur la réparation</td></tr>
      </table>
      <p>Apple Store est <strong>vendeur et fabricant</strong> : la réparation est effectuée sous garantie légale de conformité. L'art. 16 (2024/1799) s'applique → garantie prolongée de 12 mois (une seule fois).</p>
      <span class="expand-link" onclick="toggleExpand(this)">En savoir plus</span>
      <div class="expand-content">
        <p>La réparation sous garantie légale prolonge la garantie de <strong>12 mois</strong> (Service Public F11094 ; art. 16, directive 2024/1799 — ventes à partir du 31/07/2026). Apple Store étant le vendeur, il est responsable de cette extension.</p>
        <p>Exemple : achat en Apple Store en janvier 2026, défaut en juin 2026, réparation → garantie jusqu'en décembre 2026 (2 ans + 6 mois).</p>
        <p>Si le vendeur impose le remplacement : garantie renouvelée 2 ans à compter du remplacement (art. L217-11).</p>
        <p><a href="http://data.europa.eu/eli/dir/2024/1799/oj" target="_blank" rel="noopener">Directive 2024/1799, art. 16</a> · <a href="https://www.legifrance.gouv.fr/codes/id/LEGIARTI000032225325/" target="_blank" rel="noopener">Art. L217-11</a></p>
      </div>
    `;
  } else if (isYear1 && isDefect && !isAppleVendor) {
    // Achat ailleurs + réparation en Apple Store 1ère année = sous garantie constructeur
    garantApresBody = `
      <table class="price-table">
        <tr><th></th><th>Garantie légale (vendeur)</th><th>Garantie Apple (constructeur)</th></tr>
        <tr><td><strong>Après réparation en Apple Store</strong></td><td><strong>Inchangée</strong> — continue jusqu'à 2 ans<br>Responsable : ${s.purchase === "other" ? "le magasin d'achat" : "le vendeur d'origine"}<br>(art. 16 ne s'applique pas)</td><td><strong>90 jours</strong> sur la réparation</td></tr>
      </table>
      <div class="callout warn"><p><strong>Attention :</strong> la réparation est effectuée sous <strong>garantie constructeur Apple</strong> (1 an), pas sous garantie légale. L'art. 16 (prolongation de 12 mois) ne s'applique pas car la réparation n'est pas faite dans le cadre de la garantie légale de conformité.</p></div>
      <p>La garantie légale avec le vendeur d'origine (${s.purchase === "other" ? "Fnac, Darty…" : "vendeur"}) <strong>continue normalement</strong> jusqu'à 2 ans après l'achat. En cas de nouveau défaut, le client doit s'adresser à son vendeur.</p>
      <span class="expand-link" onclick="toggleExpand(this)">En savoir plus</span>
      <div class="expand-content">
        <p><strong>Pourquoi l'art. 16 ne s'applique pas ?</strong> L'article 16 modifie la directive 2019/771 sur la vente de biens — il prolonge la garantie légale de conformité <strong>uniquement</strong> lorsqu'une réparation est effectuée "dans le cadre de la garantie légale" (art. 10, directive 2019/771). Ici, la réparation est faite sous la garantie constructeur Apple (contractuelle, 1 an), pas sous la garantie légale. L'extension ne s'applique donc pas.</p>
        <p><strong>Garantie légale (vendeur) :</strong> continue jusqu'à 2 ans après l'achat, sans prolongation. Le client conserve tous ses droits auprès de son vendeur.</p>
        <p><strong>Garantie Apple (constructeur) :</strong> 90 jours sur la réparation effectuée. Expire 1 an après l'achat (déjà expirée si la réparation est en fin de 1ère année).</p>
        <p>Exemple : achat chez Fnac en janvier 2026, panne en juin 2026, réparation en Apple Store (garantie constructeur) → garantie légale Fnac jusqu'en janvier 2028 (inchangée). Garantie Apple 90 jours sur la réparation. En cas de nouveau défaut en 2027, le client s'adresse à Fnac (garantie légale, 2ème année).</p>
        <p><a href="http://data.europa.eu/eli/dir/2024/1799/oj" target="_blank" rel="noopener">Directive 2024/1799, art. 16</a> · <a href="https://www.apple.com/legal/sales-support/terms/repair/generalservice/servicetermsfr" target="_blank" rel="noopener">Conditions Apple</a></p>
      </div>
    `;
  } else if (isYear2 && isDefect && isAppleVendor) {
    // Achat Apple Store + réparation 2ème année = sous garantie légale
    garantApresBody = `
      <table class="price-table">
        <tr><th></th><th>Garantie légale</th><th>Garantie Apple</th></tr>
        <tr><td><strong>Réparation choisie</strong></td><td><strong>+6 mois</strong> (L217-13, ventes avant le 31/07/2026)<br><strong>+12 mois</strong> (art. 16 dir. 2024/1799, ventes à partir du 31/07/2026)<br>à compter de la réparation<br>Responsable : Apple Store (vendeur)</td><td>90 jours sur la réparation</td></tr>
        <tr><td><strong>Remplacement imposé</strong></td><td><strong>Renouvelée 2 ans</strong> (art. L217-11)<br>à compter du remplacement<br>Responsable : Apple Store (vendeur)</td><td>90 jours sur la réparation</td></tr>
      </table>
      <p>Apple Store est le <strong>vendeur</strong> : la réparation est sous garantie légale. L'art. 16 (2024/1799) s'applique → garantie prolongée de 12 mois (une seule fois). Garantie constructeur expirée (1 an).</p>
      <span class="expand-link" onclick="toggleExpand(this)">En savoir plus</span>
      <div class="expand-content">
        <p>La réparation sous garantie légale prolonge la garantie de <strong>12 mois</strong> (Service Public F11094 ; art. 16, directive 2024/1799 — ventes à partir du 31/07/2026). Apple Store étant le vendeur, il est responsable.</p>
        <p>Exemple : achat en Apple Store en janvier 2026 (avant le 31/07/2026), défaut en juin 2027 (2ème année), réparation → garantie prolongée de 6 mois (L217-13), jusqu'en décembre 2027.</p>
        <p><a href="http://data.europa.eu/eli/dir/2024/1799/oj" target="_blank" rel="noopener">Directive 2024/1799, art. 16</a></p>
      </div>
    `;
  } else if ((s.age === "2-5" || s.age === "5-10") && isDefect) {
    // Hors garantie — réparation payante
    garantApresBody = `
      <table class="price-table">
        <tr><th></th><th>Garantie légale</th><th>Garantie Apple</th></tr>
        <tr><td><strong>Réparation payante (hors garantie)</strong></td><td><strong>Aucune prolongation</strong> (art. 5 : le droit à la réparation ne prolonge pas la garantie)</td><td><strong>90 jours</strong> sur la réparation</td></tr>
      </table>
      <p>La réparation est <strong>payante</strong> (droit à la réparation, art. 5). L'art. 16 ne s'applique pas — pas de prolongation de garantie légale. Apple garantit uniquement la réparation pendant 90 jours.</p>
      <span class="expand-link" onclick="toggleExpand(this)">En savoir plus</span>
      <div class="expand-content">
        <p>L'art. 16 prolonge la garantie légale uniquement pour les réparations effectuées <strong>dans le cadre de la garantie légale de conformité</strong> (pendant les 2 ans). Une réparation payante hors garantie relève de l'art. 5 (droit à la réparation) — pas de prolongation.</p>
        <p>Apple offre une garantie commerciale de 90 jours sur la réparation effectuée, indépendante de la garantie légale.</p>
        <p><a href="http://data.europa.eu/eli/dir/2024/1799/oj" target="_blank" rel="noopener">Directive 2024/1799, art. 5 et 16</a></p>
      </div>
    `;
  } else if (isAccidental) {
    // Dommage accidentel — pas de garantie légale
    garantApresBody = `
      <table class="price-table">
        <tr><th></th><th>Garantie légale (vendeur d'origine)</th><th>Garantie Apple</th></tr>
        <tr><td><strong>Remplacement payant (dommage accidentel)</strong></td><td><strong>Inchangée</strong> — le vendeur d'origine reste responsable<br>Apple ne devient PAS le nouveau vendeur<br>(art. 16 et L217-11 ne s'appliquent pas)</td><td><strong>90 jours</strong> sur le remplacement</td></tr>
      </table>
      <div class="callout warn"><p><strong>Important :</strong> un remplacement payant pour dommage accidentel est un <strong>contrat de service commercial</strong> avec Apple, pas un acte de garantie légale. Le client n'a pas "acheté" un nouvel iPhone — il a payé un service. Le vendeur d'origine (ex: Fnac) reste le seul responsable de la garantie légale de conformité.</p></div>
      <p>Apple garantit l'appareil de remplacement pendant <strong>90 jours</strong> (garantie commerciale). La garantie légale avec le vendeur d'origine <strong>continue normalement</strong> jusqu'à expiration des 2 ans après l'achat initial.</p>
      <span class="expand-link" onclick="toggleExpand(this)">En savoir plus</span>
      <div class="expand-content">
        <p><strong>Pourquoi le vendeur d'origine reste-t-il responsable ?</strong> La garantie légale de conformité lie le client au vendeur pour la durée de 2 ans. Un remplacement payant hors garantie n'est pas un achat — c'est un service de réparation. Le vendeur original conserve donc sa responsabilité sur le produit d'origine (ou ses 2 ans).</p>
        <p><strong>Pourquoi l'art. 16 ne s'applique pas ?</strong> L'art. 16 prolonge la garantie uniquement pour les réparations effectuées "dans le cadre de la garantie légale de conformité" (défaut de conformité, pas dommage accidentel).</p>
        <p><strong>Pourquoi l'art. L217-11 ne s'applique pas ?</strong> Cet article renouvelle la garantie 2 ans uniquement si le <strong>vendeur impose</strong> le remplacement pendant la garantie légale. Un remplacement payant pour dommage accidentel n'est pas imposé par le vendeur — c'est une prestation commerciale.</p>
        <p><strong>Et si le remplacement est sous AppleCare+ ?</strong> Même logique : AppleCare+ est un contrat commercial, pas la garantie légale. Le remplacement est payé via la franchise AppleCare+. Le vendeur d'origine reste responsable de la garantie légale, Apple garantit le remplacement 90 jours.</p>
        <p><a href="https://www.apple.com/legal/sales-support/terms/repair/generalservice/servicetermsfr" target="_blank" rel="noopener">Conditions générales Apple</a> · <a href="https://www.legifrance.gouv.fr/codes/id/LEGIARTI000032225325/" target="_blank" rel="noopener">Art. L217-11 Code de la consommation</a></p>
      </div>
    `;
  } else {
    // Cas par défaut
    garantApresBody = `
      <table class="price-table">
        <tr><th>Type de réparation</th><th>Garantie légale</th><th>Garantie Apple</th></tr>
        <tr><td>Réparation sous garantie légale (défaut, achat Apple Store)</td><td><strong>+6 mois</strong> (L217-13, ventes avant 31/07/2026)<br><strong>+12 mois</strong> (dir. 2024/1799 art. 16, ventes à partir du 31/07/2026)<br>à compter de la réparation — vendeur responsable</td><td>90 jours</td></tr>
        <tr><td>Réparation sous garantie constructeur (achat ailleurs, 1ère année)</td><td><strong>Inchangée</strong> — art. 16 ne s'applique pas</td><td>90 jours</td></tr>
        <tr><td>Réparation hors garantie (payante)</td><td><strong>Aucune prolongation</strong></td><td>90 jours</td></tr>
        <tr><td>Remplacement imposé sous garantie (achat Apple Store)</td><td><strong>Renouvelée 2 ans</strong> (art. L217-11)</td><td>90 jours</td></tr>
        <tr><td>Remplacement payant (dommage accidentel)</td><td><strong>Inchangée</strong> — vendeur d'origine reste responsable<br>Apple ne devient pas vendeur</td><td>90 jours</td></tr>
      </table>
    `;
  }

  if (!skipGarantApres) cards.push({ title:"Durée de garantie après réparation", tag:"", tagLabel:"", body: garantApresBody });

  // 6. DÉFINITIONS (toujours affichées)
  cards.push({ title:"Définitions utiles", tag:"", tagLabel:"", body:`
    <p><strong>Garantie légale (2 ans)</strong> = obligation légale gratuite, couvre les défauts de fabrication. <strong>AppleCare+ = contrat payant</strong> optionnel, couvre aussi les dommages accidentels avec franchise.</p>
    <p><strong>Remplacement</strong> = Apple fournit un appareil neuf <strong>ou reconditionné</strong> (pièces d'origine Apple neuves et/ou précédemment utilisées, testées).</p>
    <p><strong>Amazon :</strong> vérifier la mention « Vendu et expédié par ». Si Apple est le vendeur → Apple Store (garantie légale + constructeur). Si Amazon est le vendeur → Autre vendeur (Amazon responsable de la garantie légale, Apple responsable de la garantie constructeur uniquement).</p>
    <p><strong>Achat à l'étranger (UE + EEE) :</strong> la garantie légale s'applique dans toute l'UE (27 pays) + EEE (Norvège, Islande, Liechtenstein). Durée variable : 2 ans (France, Allemagne, Italie), 3 ans (Espagne, Portugal, Suède), 5 ans (Norvège, Islande), 6 ans (Irlande, Finlande). Le vendeur étranger est responsable. Garantie constructeur Apple valable dans toute l'UE. Litige transfrontalier : <a href="https://www.europe-consommateurs.eu/" target="_blank" rel="noopener">Centre Européen des Consommateurs</a>.</p>
    <p><strong>Date d'application du droit à la réparation (art. 5) :</strong> <strong>Service Public (F11094) : le droit à la réparation s'applique aux contrats conclus à compter du 31 juillet 2026</strong> — pour les contrats antérieurs : garantie commerciale ou vices cachés uniquement. (La directive elle-même ne limite que la prolongation de garantie de 12 mois — art. 16 — aux ventes ≥ 31/07/2026, art. 21.) La transposition française étant en cours, suivre Service Public pour l'application en France.</p>
    <p><strong>Réparation ou remplacement (L217-10) :</strong> la mise en conformité doit intervenir dans les <strong>30 jours</strong> suivant la demande. Le client choisit entre réparation et remplacement ; le vendeur ne peut imposer l'autre option que si le coût est manifestement disproportionné. Passé le délai de 30 jours : réduction du prix ou résolution (remboursement sous 14 jours, pénalités de retard 10 % / 20 % / 50 % au-delà de 14 / 30 / 60 jours). La garantie est <strong>suspendue</strong> pendant l'immobilisation du bien pour réparation (L217-28). La garantie légale est <strong>transmissible</strong> au sous-acquéreur (elle porte sur le bien).</p>

      <h4 style="font-size:13px;font-weight:600;margin:12px 0 6px;">Remplacement : neuf ou reconditionné ?</h4>

      <p><strong>Directive 2019/771 (art. 13-14) :</strong> la mise en conformité doit restaurer les qualités attendues, <strong>durabilité incluse</strong> (renforcé par la directive 2024/1799, applicable depuis le 31/07/2026). Une pièce usagée dont la dégradation est déjà apparente ne remet pas le bien en conformité — le défaut persiste et le vendeur reste tenu.</p>

}

const state = { mode:"garantie", country:"france", product:"", purchase:"", age:"", condition:"", "prior-repair":"", retract:"none", enseigne:"none" };

function toggleExpand(link) {
  const content = link.nextElementSibling;
  link.classList.toggle('open');
  content.classList.toggle('open');
}

function applyScenario(btn, s) {
  // Highlight active scenario
  document.querySelectorAll('.scenario-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  // Apply state
  Object.assign(state, s);
  if (!s.mode) state.mode = "garantie";
  buildQuestionnaire();
  // Update all dropdowns to reflect the scenario
  QUESTIONS.forEach(q => {
    const sel = document.getElementById(q.id + '-select');
    const val = document.getElementById(q.id + '-value');
    if (sel && val) {
      sel.value = s[q.id];
      const opt = q.options.find(o => o.value === s[q.id]);
      if (opt) val.textContent = opt.label;
    }
  });
  renderResult();
}

function buildQuestionnaire() {
  const container = document.getElementById('questionnaire');
  container.innerHTML = "";
  // Sélecteur de mode (garantie vs retour)
  const modeBox = document.createElement('div');
  modeBox.className = 'select-box mode-box';
  modeBox.innerHTML = `
      <label for="mode-select">Type de demande</label>
      <div class="value" id="mode-value">—</div>
      <select id="mode-select" aria-label="Type de demande">
        <option value="garantie">Garantie légale &amp; réparation</option>
        <option value="retour">Retour 14 jours &amp; rétractation</option>
        <option value="bonus">Bonus réparation</option>
        <option value="reparables">Que répare-t-on ? — iPhone 17 série &amp; Air</option>
        <option value="swap-repair">Repair ou Swap ? — règles iPhone 12 → 17</option>
      </select>
      <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    `;
  container.appendChild(modeBox);
  const modeSel = modeBox.querySelector('select');
  const modeVal = modeBox.querySelector('.value');
  modeSel.value = state.mode;
  const modeLabels = { garantie: 'Garantie légale & réparation', retour: 'Retour 14 jours & rétractation', bonus: 'Bonus réparation', reparables: 'Que répare-t-on ? — iPhone 17 série & Air', 'swap-repair': 'Repair ou Swap ? — règles iPhone 12 → 17' };
  modeVal.textContent = modeLabels[state.mode] || 'Garantie légale & réparation';
  modeSel.addEventListener('change', e => {
    state.mode = e.target.value;
    buildQuestionnaire();
    renderResult();
  });
  QUESTIONS.forEach(q => {
    if (!q.modes || !q.modes.includes(state.mode)) return;
    // Cascade gauche→droite: une question dépendante ne s'affiche que si
    // sa question parente est répondue, avec les options filtrées:
    let opts = q.options;
    if (q.depends) {
      const parentVal = state[q.depends];
      if (!parentVal) {
        // Parent réinitialisé → l'enfant aussi (reset en chaîne, sinon
        // des réponses orphelines polluent le verdict):
        delete state[q.id];
        return;
      }
      if (q.optionsByGen) opts = q.optionsByGen[parentVal] || [];
      else if (q.optionsByModel) opts = q.optionsByModel[parentVal] || [];
      else if (q.optionsByPart) {
        // swap-part: clé = GÉNÉRATION (le modèle ne détermine que le
        // prix). swap-status: clé = PIÈCE choisie (parent direct):
        const partKey = (q.id === "swap-part") ? state["swap-generation"] : parentVal;
        opts = q.optionsByPart[partKey] || [];
      }
      else if (q.optionsByCat) opts = q.optionsByCat[parentVal] || [];
      // Injecter le prix swap du modèle choisi dans les labels statut:
      if (q.id === "swap-status" && state["swap-model"]) {
        const qm = QUESTIONS.find(qq => qq.id === "swap-model");
        const mOpt = (qm.optionsByModel[state["swap-generation"]] || []).find(o => o.value === state["swap-model"]);
        if (mOpt && mOpt.swapPrice) {
          opts = opts.map(o => ({ ...o, label: o.label.replace('{swap}', mOpt.swapPrice + ' €') }));
        }
      }
      // Reset si la valeur stockée n'existe plus dans les options filtrées:
      if (state[q.id] && !opts.some(o => o.value === state[q.id])) {
        delete state[q.id];
      }
    }
    const box = document.createElement('div');
    box.className = 'select-box';
    box.innerHTML = `
      <label for="${q.id}-select">${q.label}</label>
      <div class="value" id="${q.id}-value">—</div>
      <select id="${q.id}-select" aria-label="${q.label}">
        <option value="" disabled selected>Sélectionnez…</option>
        ${opts.map(o => `<option value="${o.value}">${o.label}</option>`).join('')}
      </select>
      <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    `;
    container.appendChild(box);
    const sel = box.querySelector('select');
    const val = box.querySelector('.value');
    sel.addEventListener('change', e => {
      state[q.id] = e.target.value;
      val.textContent = opts.find(o => o.value === e.target.value).label;
      buildQuestionnaire();
      // Le rebuild recrée les selects: repositionner les valeurs déjà
      // choisies (le .value affiché sinon repart à "—"):
      QUESTIONS.forEach(qq => {
        if (!qq.modes || !qq.modes.includes(state.mode)) return;
        const s2 = document.getElementById(qq.id + '-select');
        const v2 = document.getElementById(qq.id + '-value');
        if (s2 && v2 && state[qq.id]) {
          s2.value = state[qq.id];
          // Source d'options = la MÊME logique que le build (sinon label
          // faux ou {swap} non remplacé):
          let pool = qq.options;
          if (qq.depends) {
            const pv = state[qq.depends];
            if (qq.optionsByGen) pool = (qq.optionsByGen[pv] || []);
            else if (qq.optionsByModel) pool = (qq.optionsByModel[pv] || []);
            else if (qq.optionsByPart) pool = (qq.optionsByPart[qq.id === "swap-part" ? state["swap-generation"] : state[qq.depends]] || []);
            else if (qq.optionsByCat) pool = (qq.optionsByCat[pv] || []);
          }
          if (qq.id === "swap-status" && state["swap-model"]) {
            const qm = QUESTIONS.find(x => x.id === "swap-model");
            const mOpt = (qm.optionsByModel[state["swap-generation"]] || []).find(o => o.value === state["swap-model"]);
            if (mOpt && mOpt.swapPrice) {
              pool = pool.map(o => ({ ...o, label: o.label.replace('{swap}', mOpt.swapPrice + ' €') }));
            }
          }
          const found = (pool || []).find(o => o.value === state[qq.id]);
          if (found) v2.textContent = found.label;
        }
      });
      renderResult();
    });
  });
}

function getResultBonus(s) {
  // Validation d'éligibilité au Bonus Réparation en Apple Store (labellisé QualiRépar 07/2025)
  // Règles : ecosystem (fonds Réparation) — PARTICULIERS uniquement, hors garantie, panne éligible
  const bs = s["bonus-status"];
  const bp = s["bonus-product"], bw = s["bonus-warranty"];
  let br = s["bonus-repair"];
  let bc = s["bonus-cause"];

  // ===== BLOCAGE 0 : professionnel =====
  if (bs === "professionnel") {
    return { verdict: "not-eligible", title: "Client professionnel — bonus non applicable",
      summary: `Le <strong>Bonus Réparation est réservé aux particuliers</strong> : le critère officiel du fonds est l'appareil « <strong>détenu par un ménage</strong> » — les équipements d'une entreprise (SARL, EURL, micro-entreprise, société…) ou d'une organisation sont exclus. Exemples officiels de refus : sèche-linge d'un <strong>salon de coiffure</strong>, cafetière d'un <strong>club sportif</strong>. Sources : PDF ecosystem doc/257, ADEME, ecologie.gouv.fr.`,
      cards: [
        { title: "Que faire pour un appareil professionnel", tag: "blue", tagLabel: "Alternatives", body: `
          <p><strong>Réparation payante classique</strong> en Apple Store ou chez un prestataire agréé — facturée à l'entreprise, souvent récupérable en charges (TVA déductible sur le devis).</p>
          <p><strong>Vérifier les garanties :</strong> garantie légale de conformité (2 ans, également due aux professionnels non-éclairés pour certains biens), garantie constructeur, ou extension d'entreprise.</p>
          <p><strong>Assurance / flotte :</strong> si l'entreprise couvre ses équipements (multirisque pro, flotte AppleCare for Business), orienter vers la déclaration de sinistre.</p>
          <p><strong>À noter :</strong> un artisan ou commerçant <em>réparateur</em> peut se faire labelliser QualiRépar pour proposer le bonus <em>à ses clients particuliers</em> — mais jamais pour son propre équipement.</p>
          <p><a href="https://entreprendre.service-public.gouv.fr/vosdroits/F37980" target="_blank" rel="noopener">Service-public Entreprendre — fonds réparation</a></p>` } ] };
  }

  const amounts = { "iphone": ["iPhone", "25 €"], "ipad": ["iPad", "25 €"], "mac-portable": ["Mac portable", "50 €"], "mac-fixe": ["Mac fixe / tout-en-un", "50 €"], "moniteur": ["Moniteur", "30 €"] };
  const thresholds = { "mac-portable": 150, "mac-fixe": 150, "moniteur": 100 };
  const pLabel = amounts[bp] ? amounts[bp][0] : "l'appareil";
  const pAmount = amounts[bp] ? amounts[bp][1] : "";
  const cards = [];

  // ===== BLOCAGE 1 : garantie =====
  if (bw === "garantie-legale") {
    return { verdict: "not-eligible", title: "Sous garantie légale de conformité — bonus non applicable",
      summary: `L'appareil est couvert par la <strong>garantie légale de conformité</strong> (2 ans, art. L217-3 et s.) : la réparation doit être <strong>prise en charge par le vendeur</strong>, gratuitement pour le client. Le Bonus Réparation n'intervient que pour les appareils <strong>hors garantie</strong>.`,
      cards: [
        { title: "Que faire en Genius Bar", tag: "blue", tagLabel: "Procédure", body: `
          <p><strong>Orienter le client vers le vendeur</strong> (Apple si acheté sur apple.com/Apple Store, sinon l'enseigne d'achat) avec sa facture. La présomption de défaut est renforcée les 12 premiers mois (art. L217-10, 24 mois pour les biens neufs à compter du 1er janvier 2026).</p>
          <p>Si le vendeur refuse ou que le client veut accélérer : la réparation payante hors garantie reste possible, mais <strong>sans bonus</strong> tant que la garantie légale court.</p>` } ] };
  }
  if (bw === "garantie-constructeur") {
    return { verdict: "not-eligible", title: "Sous garantie constructeur / AppleCare+ — prise en charge gratuite",
      summary: `L'appareil est couvert par la <strong>garantie constructeur ou AppleCare+</strong> : la panne (si couverte) est réparée <strong>gratuitement</strong> par Apple. Le Bonus Réparation ne s'applique qu'aux réparations <strong>payantes hors garantie</strong>.`,
      cards: [
        { title: "Que faire en Genius Bar", tag: "blue", tagLabel: "Procédure", body: `
          <p>Vérifier la couverture (numéro de série → coverage.apple.com ou reçu). Si la panne est couverte : réparation <strong>0 €</strong> pour le client — inutile de parler bonus.</p>
          <p>Si la panne n'est <strong>pas couverte</strong> (casse hors AppleCare+ Loss/Theft, dégâts non couverts) : la réparation devient payante → <strong>le bonus peut alors s'appliquer</strong> si la panne est éligible. Refaire le questionnaire en « hors garantie » pour l'intervention concernée.</p>` } ] };
  }

  // ===== HORS GARANTIE : vérifier la panne =====
  // Verre arrière endommagé : ÉLIGIBLE direct (25 €) — le module lentille photo / MagSafe
  // qu'il contient est fonctionnel, Apple prend la réparation en charge
  if (br === "esthetique" || br === "logicielle" || br === "consommable") {
    const reasons = {
      "esthetique": "une réparation <strong>esthétique</strong> ne nuit pas au fonctionnement de l'appareil",
      "logicielle": "une opération de <strong>maintenance logicielle</strong> (système, réinstallation, défaut logiciel)",
      "consommable": "le remplacement d'un <strong>consommable ou accessoire</strong> (cartouche, chargeur, câble, batterie amovible)"
    };
    return { verdict: "not-eligible", title: "Intervention non éligible au Bonus Réparation",
      summary: `Le Fonds Réparation exclut ${reasons[br]} : la grille ecosystem cible les réparations qui <strong>prolongent la vie de l'appareil</strong> face à une panne ou une casse fonctionnelle.`,
      cards: [
        { title: "Alternatives pour le client", tag: "blue", tagLabel: "À proposer", body: `
          <p>Vérifier si l'intervention relève d'une <strong>garantie restante</strong> (légale 2 ans chez le vendeur), d'une <strong>assurance</strong> habitation ou d'une extension constructeur.</p>
          <p>À défaut : la réparation reste possible aux frais du client, chez Apple ou un réparateur indépendant — simplement <strong>sans réduction bonus</strong>.</p>` } ] };
  }

  // Connectique = "entrée connectique" = facteur externe (PDF ecosystem doc/257)
  if (br === "connectique" && bc !== "assurance") bc = "externe";

  if (bc === "assurance") {
    return { verdict: "not-eligible", title: "Dommage couvert par une assurance — bonus exclu",
      summary: `Les appareils couverts par une <strong>assurance</strong> (habitation, multidémie, extension) sont exclus du Bonus Réparation : le dommage doit d'abord être déclaré à l'assureur, qui prend en charge selon le contrat.`,
      cards: [
        { title: "Procédure", tag: "blue", tagLabel: "Procédure", body: `
          <p>Conseiller au client de <strong>déclarer le sinistre</strong> à son assureur avant toute réparation payante (franchise souvent plus basse que le coût de réparation).</p>
          <p>Si l'assurance <strong>refuse</strong> la prise en charge (exclusion, franchise élevée) : la réparation redevient « normale » → le bonus peut s'appliquer si la panne est éligible.</p>` } ] };
  }

  // ===== PANNE ÉLIGIBLE : calculer le montant =====
  // Seuils officiels (Mac ≥ 150 €, moniteur ≥ 100 €) : systématiquement atteints en Apple Store → non posés
  const isEligiblePanne = ["ecran", "batterie", "casse", "panne", "verre-arriere"].includes(br);
  const passed = isEligiblePanne && bc !== "externe" && bc !== "usage";
  const verdict = passed ? "eligible" : "not-eligible";
  const title = passed ? `Bonus réparation applicable — ${pAmount} pour ${pLabel}` : "Contexte de panne incompatible avec le bonus";
  const summary = passed
    ? `<strong>${pLabel} hors garantie</strong> + intervention éligible + contexte normal : le bonus de <strong>${pAmount}</strong> est <strong>déduit automatiquement de la facture</strong> en Apple Store (labellisé QualiRépar).`
    : `Un dommage causé par un <strong>facteur externe</strong> (défaut électrique, installation, <strong>oxydation/immersion</strong>, connectique, mauvais entretien) ou un <strong>usage non conforme</strong> du client n'ouvre pas droit au bonus.`;

  cards.push({ title: `Récapitulatif — ${pLabel} (${pAmount})`, tag: verdict === "eligible" ? "green" : verdict === "partial" ? "amber" : "red", tagLabel: verdict === "eligible" ? "Bonus OK" : verdict === "partial" ? "Seuil" : "Refusé", body: `
    <p><strong>Client :</strong> particulier ✓ (le bonus est réservé aux particuliers — les équipements d'entreprise sont exclus).</p>
    <p><strong>Produit :</strong> ${pLabel} — bonus de référence ${pAmount}.</p>
    <p><strong>Statut :</strong> hors garantie (légale et constructeur) ✓</p>
    <p><strong>Intervention :</strong> ${ { "ecran": "remplacement d'écran (éligible depuis 2024 pour les téléphones, désormais TV et écrans)", "batterie": "batterie inamovible (éligible)", "casse": "casse empêchant le fonctionnement (éligible)", "panne": "panne fonctionnelle (éligible)", "verre-arriere": "verre arrière endommagé — module lentille photo / MagSafe touché, composant fonctionnel : Apple le prend en charge" }[br] || "" }</p>
    <p><strong>Contexte :</strong> ${ bc === "normale" ? "panne normale d'usage ✓" : "facteur externe ou usage non conforme → excluant" }.</p>
    <p><strong>Résultat :</strong> ${ passed ? `bonus de <strong>${pAmount}</strong> déduit immédiatement de la facture Apple Store.` : "bonus non applicable." }</p>
    ${ thresholds[bp] ? `<p><em>Seuil officiel de déclenchement : ${thresholds[bp]} € (${pLabel}) — systématiquement dépassé en Apple Store.</em></p>` : "" }` });

  cards.push({ title: "Grille officielle d'éligibilité (exemples ecosystem)", tag: null, tagLabel: "PDF doc/257", body: `
    <p><strong>✅ Acceptées (exemples officiels) :</strong> écran cassé de téléphone/ordinateur, dalle TV cassée, <strong>batterie soudée ou collée</strong> à l'appareil (téléphone, ordinateur — le cas iPhone/Mac), poignée de hublot, joint de lave-linge fuyard, <strong>ventilateur d'un ordinateur portable</strong> ou d'une console, clayette de réfrigérateur, enrouleur d'aspirateur.</p>
    <p><strong>❌ Refusées (exemples officiels) :</strong> dommage esthétique ou n'empêchant pas le fonctionnement (revêtement griffé, impact sur porte — le <strong>verre arrière endommagé</strong> reste éligible chez Apple : il intègre le module lentille photo / MagSafe, composant fonctionnel), batterie <strong>amovible</strong> (VAE, outillage), chargeur/câble amovible, cartouche, ampoule/LED (y compris barre de LED de TV), objectif photo, vente de pièce seule sans acte de réparation, mises à jour et logiciels, <strong>port USB HS (entrée connectique)</strong>, <strong>oxydation / immersion</strong>, pièce coincée / circuit encrassé (mauvais entretien), défaut de montage, appareil acheté à l'étranger ou marque non distribuée en France, rappel de parc constructeur.</p>
    <p><strong>Conditions produit :</strong> plaque signalétique ou IMEI lisible (plaque effacée / marquée « HS » → refus), appareil détenu par un <strong>ménage</strong>, non couvert par une assurance, conforme à la réglementation.</p>
    <p><a href="https://www.ecosystem.eco/document/257" target="_blank" rel="noopener">PDF officiel — appareil et panne éligibles (exemples)</a> · <a href="https://www.ecosystem.eco/document/56" target="_blank" rel="noopener">Grille des montants (PDF)</a></p>` });

  cards.push({ title: "Application en Apple Store", tag: "green", tagLabel: "QualiRépar", body: `
    <p>Les Apple Store de France sont <strong>labellisés QualiRépar depuis juillet 2025</strong> : le bonus est appliqué <strong>automatiquement</strong> à la facture, sans démarche du client, pour les réparations éligibles <strong>hors garantie</strong>.</p>
    <p><strong>Garantie de la réparation :</strong> 3 mois minimum chez un réparateur QualiRépar (90 jours chez Apple sur les réparations payantes).</p>
    <p><a href="https://www.ecosystem.eco/comprendre/bonus-reparation" target="_blank" rel="noopener">Grille officielle ecosystem</a> · <a href="https://www.apple.com/fr/legal/sales-support/sales-policies/retail_fr.html" target="_blank" rel="noopener">CGV Apple Store France</a></p>` });

  return { verdict, title, summary, cards };
}

function renderResult() {
  const panel = document.getElementById('result-panel');
  const panel2 = panel;
  if (state.mode === "reparables") {
    if (!state["reparables-cat"]) {
      panel.innerHTML = `<div class="result-placeholder">Choisissez le <strong>sous-ensemble</strong> pour afficher les symptômes correspondants.</div>`;
      return;
    }
    if (!state["reparables-symptom"]) {
      panel.innerHTML = `<div class="result-placeholder">Choisissez le <strong>symptôme constaté</strong> pour afficher le sous-ensemble à remplacer.</div>`;
      return;
    }
    showResult(panel2, getResultReparables(state));
    return;
  }
  if (state.mode === "swap-repair") {
    const ans = [state["swap-generation"], state["swap-part"], state["swap-status"]].filter(Boolean).length;
    if (ans < 3) {
      panel.innerHTML = `<div class="result-placeholder">Question Repair ou Swap — ${3 - ans} question${3 - ans > 1 ? 's' : ''} restante${3 - ans > 1 ? 's' : ''}.</div>`;
      return;
    }
    showResult(panel2, getResultSwap(state));
    return;
  }
  if (state.mode === "bonus") {
    const bp = state["bonus-product"];
    const bc = state["bonus-context"];
    const bss = state["bonus-status"], bws = state["bonus-warranty"], brs = state["bonus-repair"], bcs = state["bonus-cause"];
    // Refus IMMÉDIAT si statut professionnel (bloquant avant toutes les autres questions)
    if (bss === "professionnel") {
      showResult(panel2, getResultBonus(state));
      return;
    }
    const bAns = [bss, bp, bws, brs, bcs].filter(Boolean).length;
    if (bAns < 5) {
      panel.innerHTML = `<div class="result-placeholder">Questionnaire d'éligibilité — ${5 - bAns} question${5 - bAns > 1 ? 's' : ''} restante${5 - bAns > 1 ? 's' : ''} pour valider le bonus.</div>`;
      return;
    }
    showResult(panel2, getResultBonus(state));
    return;
  }
  if (state.mode === "retour") {
    const hasRetract = state.retract && state.retract !== "none";
    const hasEnseigne = state.enseigne && state.enseigne !== "none";
    if (!hasRetract && !hasEnseigne) {
      panel.innerHTML = `<div class="result-placeholder">Choisissez la <strong>situation de retour</strong> et/ou l'<strong>enseigne d'achat</strong> pour afficher les conditions applicables.</div>`;
      return;
    }
    showResult(panel2, getResultRetour(state));
    return;
  }
  const visible = QUESTIONS.filter(q => q.modes && q.modes.includes("garantie"));
  const answered = visible.filter(q => state[q.id]).length;
  const remaining = visible.length - answered;
  if (answered < visible.length) {
    panel.innerHTML = `<div class="result-placeholder">Répondez aux ${remaining} question${remaining > 1 ? 's' : ''} restante${remaining > 1 ? 's' : ''}.</div>`;
    return;
  }
  showResult(panel2, getResult(state));
}

function showResult(panel, r) {
  const icons = { "eligible":"✅", "partial":"⚠️", "not-eligible":"❌" };
  const classes = { "eligible":"eligible", "partial":"partial", "not-eligible":"not-eligible" };
  let html = `<div class="verdict-box ${classes[r.verdict]}"><div class="verdict-icon">${icons[r.verdict]}</div><div><h2>${r.title}</h2><p>${r.summary}</p></div></div>`;
  r.cards.forEach(c => {
    html += `<div class="quick-card"><h3>${c.tag ? `<span class="tag ${c.tag}">${c.tagLabel}</span>` : ""}${c.title}</h3>${c.body}</div>`;
  });
  panel.innerHTML = html;
}

buildQuestionnaire();
