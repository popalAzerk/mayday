<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mac Admin Compagnon</title>
    <script>(function(){try{var t=localStorage.getItem('apple-hub-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
    <link rel="stylesheet" href="./assets/css/fontawesome.min.css" />
    <!-- Shared Master Theme CSS (for dark mode + basic vars if needed) -->
    <link rel="stylesheet" href="../assets/css/shared-theme.css?v=202609180921">
    <!-- Local specific Dashboard styles -->
    <link rel="stylesheet" href="./css/styles.css?v=202609180921">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛠️</text></svg>">



<style>
/* === Mode Admin / Genius === */
.mode-toggle {
  display: flex;
  background: var(--panel-bg);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border: 1px solid var(--border-color);
  box-shadow: var(--shadow);
  border-radius: 20px;
  padding: 6px 3px;
  gap: 2px;
}
.mode-btn {
  border: none;
  background: transparent;
  padding: 6px 14px;
  border-radius: 16px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted, #8e8e93);
  cursor: pointer;
  transition: all .2s;
}
.mode-btn.active {
  background: var(--apple-blue, #007aff);
  color: #fff;
}
/* Mode Genius: pas de planning ni d'occupation */
body.mode-genius #planning-panel,
body.mode-genius #occupation-panel {
  display: none !important;
}
body.mode-genius .dashboard-wrapper {
  grid-template-columns: 1fr 1fr 0 !important;
}
@media (max-width: 1024px) {
  body.mode-genius .dashboard-wrapper { grid-template-columns: 1fr !important; }
}

/* === Pulse du panneau après validation (direction visuelle) === */
.bento-panel.panel-flash {
  animation: panelFlash 1.3s ease-out;
}
@keyframes panelFlash {
  0% { box-shadow: 0 0 0 0 rgba(0, 122, 255, 0.45), var(--shadow); border-color: var(--apple-blue); }
  60% { box-shadow: 0 0 0 12px rgba(0, 122, 255, 0.12), var(--shadow); border-color: var(--apple-blue); }
  100% { box-shadow: 0 0 0 0 rgba(0, 122, 255, 0), var(--shadow); border-color: var(--border-color); }
}

/* === Overlay validation des pièces (mode Genius) === */
#parts-validate-overlay {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%) translateY(120px);
  z-index: 900;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 13px 24px;
  border: none;
  border-radius: 980px;
  background: var(--apple-blue, #007aff);
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  font-family: var(--font-main);
  box-shadow: 0 8px 32px rgba(0, 122, 255, 0.35);
  cursor: pointer;
  opacity: 0;
  pointer-events: none;
  transition: all .3s cubic-bezier(.2, .8, .2, 1);
}
#parts-validate-overlay.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
  pointer-events: auto;
}
#parts-validate-overlay:hover { filter: brightness(1.08); }
#parts-validate-overlay:active { transform: translateX(-50%) scale(.97); }
#parts-validate-overlay .cnt {
  background: rgba(255, 255, 255, 0.25);
  border-radius: 12px;
  padding: 1px 10px;
  font-size: 12px;
  font-weight: 700;
}
</style>
</head>

<body class="needs-global-nav">
    <!-- Header -->
    <header>
        <div class="header-left">
            <div class="mode-toggle" id="mode-toggle" title="Basculer Admin / Genius">
                <button id="mode-admin" class="mode-btn active" onclick="setAppMode('admin')">Admin</button>
                <button id="mode-genius" class="mode-btn" onclick="setAppMode('genius')">Genius</button>
            </div>
        </div>
        <div class="header-actions" id="header-actions">
            <button class="actions-trigger" onclick="toggleHeaderActions(this)" title="Actions" aria-expanded="false">
                <i class="fa-solid fa-bars"></i>
            </button>
            <div class="actions-inner">
            <!-- Gemini Toggle injected by shared-app.js -->
            <button onclick="openModal('dashboard-modal')" class="btn btn-icon" title="Dashboard">
                <i class="fa-solid fa-chart-pie"></i>
            </button>
            <button onclick="openHistoryModal()" class="btn btn-icon" title="Historique 7 jours">
                <i class="fa-solid fa-clock-rotate-left"></i>
            </button>
            <button onclick="saveSchedule()" class="btn btn-icon btn-primary" title="Cmd+S pour Sauvegarder">
                <i class="fa-solid fa-save"></i>
            </button>
            <button onclick="resetCurrentSelection()" class="btn btn-icon" title="Reset">
                <i class="fa-solid fa-house"></i>
            </button>
            </div>
        </div>
    </header>

    <!-- Main Layout (Bento Grid) -->
    <div class="dashboard-wrapper">

        <!-- Left Panel: Navigation & Selection -->
        <div class="bento-panel">
            <div class="panel-header">
                <div class="search-container">
                    <i class="fa-solid fa-search"></i>
                    <input id="search-input" class="input-field" type="text" placeholder="Rechercher (Cmd+F)..." oninput="handleSearch(this.value)" />
                </div>
                <div id="back-button-container" class="hidden" style="margin-top: 12px;">
                    <button id="back-button" onclick="goBack()" class="btn">
                        <i class="fa-solid fa-arrow-left"></i> Retour
                    </button>
                </div>
                <div id="breadcrumb-container" style="margin-top: 12px;"></div>
            </div>
            
            <div id="navigation-container" class="panel-body">
                <!-- Screen 1: Categories -->
                <div id="categories-screen" class="screen active">
                    <h2 style="margin-bottom: 16px;">Catégories</h2>
                    <div id="categories-grid" class="grid-2"></div>
                </div>
                <!-- Screen 2: Subcategories -->
                <div id="subcategories-screen" class="screen">
                    <h2 id="subcategories-title" style="margin-bottom: 16px;"></h2>
                    <div id="subcategories-grid" class="grid-2"></div>
                </div>
                <!-- Screen 3: Models -->
                <div id="models-screen" class="screen">
                    <h2 id="models-title" style="margin-bottom: 12px;"></h2>
                    <div id="size-filter-buttons" style="display:flex; gap:8px; margin-bottom: 16px; flex-wrap: wrap;"></div>
                    <div id="models-grid" class="grid-3"></div>
                </div>
                <!-- Screen 4: Parts -->
                <div id="parts-screen" class="screen">
                    <h2 id="parts-model-title" style="margin-bottom: 16px;"></h2>
                    <div id="repair-parts-list"></div>
                </div>
            </div>
        </div>

        <!-- Middle Panel: Active Repair Info -->
        <div class="bento-panel">
            <div class="panel-header">
                <h3 style="margin:0;">Intervention sélectionnée</h3>
            </div>
            <div id="repair-info-panel" class="panel-body" style="display: flex; flex-direction: column;">
                <div class="text-center text-muted" style="margin: auto;">
                    <i class="fa-solid fa-gears" style="font-size: 32px; margin-bottom: 8px;"></i>
                    <p>Sélectionnez un Mac</p>
                </div>
            </div>
            
            <!-- Dashboard Timeline / Occupation UI built here -->
            <div class="timeline-container" id="occupation-panel" style="border-radius: 0; border-top: 1px solid var(--border-color);">
                <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                    <strong>Occupation du Planning</strong>
                    <span id="stats-used-minutes-main" class="font-mono text-blue font-bold">0 min</span>
                </div>
                <div style="display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted);">
                    <span>Dispo: <span id="stats-mac-capacity-main" class="font-mono font-bold">~0 Mac</span></span>
                </div>
                <div class="timeline-bar-bg">
                    <div id="capacity-bar-main" class="timeline-bar-fill" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- Right Panel: Scheduled Repairs & Planning -->
        <div class="bento-panel" id="planning-panel">
            <div class="panel-header" style="display: flex; justify-content: space-between; align-items: center;">
                <h3 style="margin:0;">Planning</h3>
                <span id="repair-count" style="background: var(--apple-blue); color: white; border-radius: 12px; padding: 2px 8px; font-size: 12px;">0</span>
            </div>
            <div id="scheduled-repairs-container" class="panel-body" style="background: rgba(120, 120, 120, 0.02)">
            </div>
        </div>

    </div>

    <!-- Overlay validation des pièces (mode Genius) -->
    <button id="parts-validate-overlay" onclick="validateParts()">
        <i class="fa-solid fa-check"></i> Valider les pièces <span class="cnt" id="parts-validate-count">0</span>
    </button>

    <!-- Toast -->
    <div id="toast-notification" class="toast">
        <i class="fa-solid fa-check-circle"></i> <span id="toast-message">Sauvegardé !</span>
    </div>

    <!-- Modals -->
    <!-- Dashboard Modal -->
    <div id="dashboard-modal" class="modal-overlay">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                <h2>Paramètres (Cmd+D)</h2>
                <button onclick="closeModal('dashboard-modal')" class="btn btn-icon"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div style="display: flex; flex-direction: column; gap: 16px; margin-bottom: 24px;">
                <div>
                    <label>Genius (<span id="genius-count-label">4</span>)</label>
                    <input id="genius-slider" type="range" min="1" max="10" value="4">
                </div>
                <div>
                    <label>Heures Dispo (<span id="work-hours-label">8</span>)</label>
                    <input id="work-hours-slider" type="range" min="1" max="12" value="8">
                </div>
                <div>
                    <label>Vitesse (<span id="multiplier-label">1.0</span>x)</label>
                    <input id="multiplier-slider" type="range" min="0.1" max="2.0" step="0.1" value="1.0">
                </div>
                <div>
                    <label>Cas RIP (<span id="rip-count-label">0</span>)</label>
                    <input id="rip-slider" type="range" min="0" max="10" value="0">
                </div>
            </div>
            <div style="display: flex; gap: 8px; justify-content: flex-end; border-top: 1px solid var(--border-color); padding-top: 16px;">
                <button onclick="resetDay()" class="btn" style="color: var(--apple-red); margin-right: auto;"><i class="fa-solid fa-trash"></i> Reset Journée</button>
                <button id="reset-settings-btn" class="btn">Défaut</button>
                <button id="save-settings-btn" class="btn btn-primary">Sauvegarder</button>
            </div>
        </div>
    </div>

    <!-- Repair Details Modal -->
    <div id="repair-details-modal" class="modal-overlay">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h2 id="details-title">Détails de Réparation</h2>
                <button onclick="closeModal('repair-details-modal')" class="btn btn-icon"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="details-body" style="display: flex; flex-direction: column; gap: 16px;"></div>
        </div>
    </div>

    <!-- History Modal (7 derniers jours) -->
    <div id="history-modal" class="modal-overlay">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h2>Historique — 7 derniers jours</h2>
                <button onclick="closeModal('history-modal')" class="btn btn-icon"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="history-body" style="display: flex; flex-direction: column; gap: 12px; max-height: 60vh; overflow-y: auto;"></div>
        </div>
    </div>

    <!-- Scripts -->
    <!-- Shared App injects Global Nav and manages Dark Mode -->
    <script src="../assets/js/shared-app.js?v=202609180921"></script>
    <script src="./js/config.js"></script>
    <script src="./js/mac-guides.js"></script>
    <script src="./js/diagnostics-data.js"></script>
    <script src="./data/mac-data-raw.js"></script>
    <script src="./js/part-diagnostics.js"></script>
    <script src="./js/state.js"></script>
    <script src="./js/render.js"></script>
    <script src="./js/handlers.js"></script>
    <script src="./js/app.js"></script>
</body>
</html>
